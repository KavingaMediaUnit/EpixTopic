<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - EPX TOPIK Exam Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Montserrat:wght@600;700;800;900&display=swap');
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .brand-font {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-tr from-[#3b5bfd] via-[#8935ea] to-[#eb3889] flex flex-col items-center justify-between p-4 sm:p-6 antialiased select-none">

  <!-- Top Spacer -->
  <div></div>

  <!-- CENTER REGISTRATION CARD (Matching Screenshots 2 & 3) -->
  <div class="w-full max-w-[500px] bg-white rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-5 my-6">
    
    <!-- Header -->
    <div class="flex flex-col items-center">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight brand-font">
        EPX-TOPIK
      </h1>
      <p class="text-xs text-slate-500 font-medium mt-0.5">
        Create Your Account
      </p>
    </div>

    <!-- Registration Form -->
    <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5 text-left text-xs">
      
      <!-- Register As * (Dropdown with Student & Teacher) -->
      <div>
        <label for="register-role" class="block font-bold text-slate-700 mb-1">
          Register As <span class="text-red-500">*</span>
        </label>
        <select id="register-role" onchange="handleRoleChange()" required
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
          <option value="Teacher" selected>Teacher</option>
          <option value="Student">Student</option>
        </select>
      </div>

      <!-- First Name & Last Name -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="first-name" class="block font-bold text-slate-700 mb-1">First Name</label>
          <input type="text" id="first-name" placeholder="First name"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium placeholder-slate-400">
        </div>
        <div>
          <label for="last-name" class="block font-bold text-slate-700 mb-1">Last Name</label>
          <input type="text" id="last-name" placeholder="Last name"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium placeholder-slate-400">
        </div>
      </div>

      <!-- Username * -->
      <div>
        <label for="reg-username" class="block font-bold text-slate-700 mb-1">
          Username <span class="text-red-500">*</span>
        </label>
        <input type="text" id="reg-username" required value="hanakorean"
          pattern="[A-Za-z0-9_]{6,10}"
          title="6-10 characters. Letters, numbers, and underscores only."
          class="w-full px-3.5 py-2.5 rounded-xl border border-blue-400 bg-blue-50/40 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 font-medium text-slate-800">
        <p class="text-[10px] text-slate-400 mt-1">
          6-10 characters. Letters, numbers, and underscores only.
        </p>
      </div>

      <!-- Email * -->
      <div>
        <label for="reg-email" class="block font-bold text-slate-700 mb-1">
          Email <span class="text-red-500">*</span>
        </label>
        <input type="email" id="reg-email" required placeholder="your@email.com"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium placeholder-slate-400">
      </div>

      <!-- Password * & Confirm * -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="reg-pwd" class="block font-bold text-slate-700 mb-1">
            Password <span class="text-red-500">*</span>
          </label>
          <input type="password" id="reg-pwd" required minlength="6" value="password123"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/60 focus:outline-none focus:border-blue-500 font-medium">
        </div>
        <div>
          <label for="reg-confirm-pwd" class="block font-bold text-slate-700 mb-1">
            Confirm <span class="text-red-500">*</span>
          </label>
          <input type="password" id="reg-confirm-pwd" required minlength="6" value="password123" placeholder="Repeat password"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium placeholder-slate-400">
        </div>
      </div>

      <!-- Phone Number & Country -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="reg-phone" class="block font-bold text-slate-700 mb-1">Phone Number</label>
          <input type="text" id="reg-phone" value="+94 77 123 4567"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium">
        </div>
        <div>
          <label for="reg-country" class="block font-bold text-slate-700 mb-1">Country</label>
          <select id="reg-country" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white font-medium text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="LK" selected>Sri Lanka</option>
            <option value="KR">South Korea</option>
            <option value="NP">Nepal</option>
            <option value="VN">Vietnam</option>
            <option value="KH">Cambodia</option>
            <option value="BD">Bangladesh</option>
            <option value="MM">Myanmar</option>
          </select>
        </div>
      </div>

      <!-- Gender & Date of Birth * -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="reg-gender" class="block font-bold text-slate-700 mb-1">Gender</label>
          <select id="reg-gender" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white font-medium text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="">Select</option>
            <option value="male" selected>Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label for="reg-dob" class="block font-bold text-slate-700 mb-1">
            Date of Birth <span class="text-red-500">*</span>
          </label>
          <input type="date" id="reg-dob" required value="1998-05-12"
            class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 font-medium text-slate-700">
        </div>
      </div>

      <!-- Terms & Privacy Checkbox -->
      <div class="pt-1">
        <label class="flex items-start gap-2 cursor-pointer text-slate-600">
          <input type="checkbox" id="reg-terms" required checked class="mt-0.5 rounded text-blue-600 focus:ring-blue-500 border-slate-300">
          <span class="text-[11px] leading-relaxed">
            I agree to the <a href="javascript:void(0)" class="text-blue-600 font-semibold hover:underline">Terms of Service</a> and <a href="javascript:void(0)" class="text-blue-600 font-semibold hover:underline">Privacy Policy</a>
          </span>
        </label>
      </div>

      <!-- Submit Button (Purple / Indigo) -->
      <button type="submit" id="btn-create-account"
        class="w-full py-3 px-4 rounded-xl text-white font-bold text-xs bg-gradient-to-r from-indigo-600 via-purple-600 to-fuchsia-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.98] transition shadow-lg shadow-purple-500/25 tracking-wide mt-2">
        Create Account
      </button>

      <!-- Sign In Footer Link -->
      <div class="text-center text-xs text-slate-600 pt-2">
        <span>Already have an account?</span>
        <a href="login.html" class="text-blue-600 font-bold hover:underline ml-1">
          Sign in
        </a>
      </div>
    </form>
  </div>

  <!-- Bottom Copyright -->
  <footer class="text-[11px] text-white/80 font-medium py-3 text-center">
    &copy; 2026 EPX-TOPIK. All rights reserved.
  </footer>

  <script>
    function handleRoleChange() {
      const role = document.getElementById('register-role').value;
      const btn = document.getElementById('btn-create-account');
      if (role === 'Teacher') {
        btn.innerText = "Create Teacher Admin Account";
      } else {
        btn.innerText = "Create Student Account";
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('register-role').value;
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pwd = document.getElementById('reg-pwd').value;
      const confirmPwd = document.getElementById('reg-confirm-pwd').value;

      if (pwd !== confirmPwd) {
        alert('Passwords do not match! Please check again.');
        return;
      }

      // Store in registered users list
      let users = [];
      try {
        users = JSON.parse(localStorage.getItem('epx_registered_users') || '[]');
      } catch(err) {}

      // Add user record
      users.push({
        role: role,
        username: username,
        email: email,
        name: document.getElementById('first-name').value + ' ' + document.getElementById('last-name').value,
        phone: document.getElementById('reg-phone').value,
        dob: document.getElementById('reg-dob').value,
        createdAt: new Date().toISOString()
      });
      localStorage.setItem('epx_registered_users', JSON.stringify(users));

      // Also set current active session
      localStorage.setItem('epx_current_user', JSON.stringify({
        username: username,
        role: role.toLowerCase(),
        loginTime: new Date().toISOString()
      }));

      alert(`Account created successfully as ${role}!\nUsername: ${username}\nRedirecting to ${role === 'Teacher' ? 'Teacher Admin Dashboard' : 'Student UBT Simulator'}...`);

      if (role === 'Teacher') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
